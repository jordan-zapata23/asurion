# Render Blueprint. Push this folder to a GitHub repo, then in Render: New > Blueprint.
# Free tier sleeps after 15 min idle (first request then takes ~30s). Use the
# Starter plan for the live demo, or hit /healthz five minutes before you present.
services:
  - type: web
    name: protectco-legacy-portals
    runtime: node
    plan: starter
    rootDir: portals
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_TZ
        value: America/Chicago
      - key: COOKIE_SECRET
        generateValue: true
      # Service-account credentials. Mirror these into Decagon team secrets.
      - key: ENROLLMENT_USER
        value: decagon.svc
      - key: ENROLLMENT_PASS
        sync: false
      - key: CLAIMS_USER
        value: decagon.svc
      - key: CLAIMS_PASS
        sync: false
      - key: SCHEDULER_USER
        value: decagon.svc
      - key: SCHEDULER_PASS
        sync: false
